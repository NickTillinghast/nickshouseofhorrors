AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Nicks House of Horrors, one-time: the Route 53 hosted zone. Finishes right away.
  Copy the NameServers output into Wix ("Use custom nameservers"), then deploy dns-cert.yml.

Parameters:
  DomainName:
    Type: String
    Default: nickshouseofhorrors.com
  # Proves to Google Search Console that we own the domain. Not a secret: anyone can look it up
  GoogleSiteVerification:
    Type: String
    Default: google-site-verification=IrME_ug0NpgYm3Qnen7zdch5xwf26ssvCF9FiAyiNgc

Resources:
  HostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: Nicks House of Horrors (registered at Wix, DNS here)

  # TXT records on the bare domain. Add other verifications (Bing, email providers) to this list
  RootTxt:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: TXT
      TTL: "300"
      ResourceRecords:
        - !Sub '"${GoogleSiteVerification}"'

Outputs:
  HostedZoneId:
    Value: !Ref HostedZone
    Export:
      Name: nickshouseofhorrors-hosted-zone-id
  NameServers:
    Description: Paste these 4 into Wix
    Value: !Join [", ", !GetAtt HostedZone.NameServers]
